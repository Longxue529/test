<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>DeepSeek 随身版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

    <script>
        tailwind.config = { darkMode: 'media', theme: { extend: { colors: { darkbg: '#121212', darksurface: '#1e1e1e' } } } }
        marked.setOptions({
            highlight: (code, lang) => hljs.getLanguage(lang) ? hljs.highlight(code, { language: lang }).value : hljs.highlightAuto(code).value,
            breaks: true
        });
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body pre { background: #282c34; border-radius: 0.5rem; padding: 1rem; margin-top: 0.5rem; margin-bottom: 0.5rem; overflow-x: auto; font-size: 0.875rem; }
        textarea:focus { outline: none; box-shadow: none; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkbg dark:text-gray-100 h-screen flex flex-col overflow-hidden">

    <header class="flex-none p-3 bg-white dark:bg-darksurface border-b border-gray-200 dark:border-gray-800 shadow-sm z-10">
        <div class="flex items-center justify-between mb-2">
            <div class="font-bold text-base flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                DeepSeek 随身版
            </div>
            <div class="flex items-center gap-2">
                <button id="clearBtn" class="px-2 py-1 text-xs bg-red-50 text-red-600 dark:bg-red-950/30 dark:text-red-400 rounded border border-red-200 dark:border-red-900/50">清空历史</button>
                <select id="modelSelect" class="px-2 py-1 text-xs bg-gray-100 dark:bg-gray-800 rounded outline-none border border-gray-200 dark:border-gray-700">
                    <option value="deepseek-chat">V3 (Chat)</option>
                    <option value="deepseek-reasoner">R1 (Reasoner)</option>
                </select>
            </div>
        </div>
        <input type="password" id="apiKey" placeholder="输入 API Key 自动保存..." 
            class="w-full px-3 py-2 text-sm bg-gray-100 dark:bg-gray-800 rounded-lg outline-none border border-transparent focus:border-blue-500" />
    </header>

    <main id="chatContainer" class="flex-1 overflow-y-auto p-3 space-y-5 scroll-smooth">
        <div id="welcomeBox" class="text-center text-gray-400 text-xs my-8">暂无聊天记录，输入消息即可开始</div>
    </main>

    <footer class="flex-none p-3 bg-white dark:bg-darksurface border-t border-gray-200 dark:border-gray-800">
        <div class="relative bg-gray-100 dark:bg-gray-800 rounded-xl flex items-end p-1">
            <textarea id="userInput" rows="1" placeholder="说点什么..." 
                class="w-full bg-transparent p-2.5 pl-3 pr-12 resize-none max-h-32 overflow-y-auto text-sm m-0 text-gray-900 dark:text-gray-100"></textarea>
            <button id="sendBtn" class="absolute right-2 bottom-2 p-1.5 rounded-lg bg-blue-600 text-white active:bg-blue-700 disabled:bg-gray-400 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
        </div>
    </footer>

    <script>
        const DOM = {
            apiKey: document.getElementById('apiKey'),
            modelSelect: document.getElementById('modelSelect'),
            chatContainer: document.getElementById('chatContainer'),
            userInput: document.getElementById('userInput'),
            sendBtn: document.getElementById('sendBtn'),
            clearBtn: document.getElementById('clearBtn'),
            welcomeBox: document.getElementById('welcomeBox')
        };

        let messageHistory = [];
        let isGenerating = false;

        // 【关键改动：初始化时从 localStorage 加载数据】
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('ds_key')) DOM.apiKey.value = localStorage.getItem('ds_key');
            if (localStorage.getItem('ds_model')) DOM.modelSelect.value = localStorage.getItem('ds_model');
            if (localStorage.getItem('ds_history')) {
                messageHistory = JSON.parse(localStorage.getItem('ds_history'));
                if (messageHistory.length > 0) {
                    DOM.welcomeBox.style.display = 'none';
                    // 恢复历史 UI 气泡
                    messageHistory.forEach((msg, idx) => {
                        const tempId = msg.role === 'assistant' ? `hist-${idx}` : '';
                        appendMessageDOM(msg.role, msg.content, tempId);
                        if (msg.role === 'assistant') {
                            const container = document.getElementById(tempId);
                            if(container) {
                                container.querySelector('.msg-content').innerHTML = `<div class="markdown-body text-sm">${marked.parse(msg.content)}</div>`;
                                container.setAttribute('data-raw', msg.content);
                            }
                        }
                    });
                    document.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
                    scrollToBottom();
                }
            }
        });

        // 监听配置变动并实时保存
        DOM.apiKey.addEventListener('input', () => localStorage.setItem('ds_key', DOM.apiKey.value.trim()));
        DOM.modelSelect.addEventListener('change', () => localStorage.setItem('ds_model', DOM.modelSelect.value));
        
        // 清空历史按钮
        DOM.clearBtn.addEventListener('click', () => {
            if (confirm('确定要清空所有聊天记录吗？')) {
                messageHistory = [];
                localStorage.removeItem('ds_history');
                location.reload();
            }
        });

        DOM.userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 128) + 'px';
        });

        DOM.sendBtn.addEventListener('click', handleSend);

        async function handleSend() {
            const text = DOM.userInput.value.trim();
            const apiKey = DOM.apiKey.value.trim();
            const model = DOM.modelSelect.value;

            if (!text || isGenerating) return;
            if (!apiKey) return alert("记得先输入 API Key 噢！");

            DOM.welcomeBox.style.display = 'none';
            DOM.userInput.value = '';
            DOM.userInput.style.height = 'auto';
            
            appendMessageDOM('user', text);
            messageHistory.push({ role: 'user', content: text });
            saveHistoryToLocal(); // 保存用户发送的消息

            const msgId = 'msg-' + Date.now();
            appendMessageDOM('assistant', '', msgId);
            setLoadingState(true);

            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: model, messages: messageHistory, stream: true })
                });

                if (!response.ok) {
                    updateMessageDOM(msgId, '', `<span class="text-red-500">请求失败 (${response.status})</span>`, false);
                    messageHistory.pop();
                    saveHistoryToLocal();
                    return;
                }
                await processStream(response.body.getReader(), msgId);
            } catch (err) {
                updateMessageDOM(msgId, '', `<span class="text-red-500">网络错误: ${err.message}</span>`, false);
                messageHistory.pop();
                saveHistoryToLocal();
            } finally {
                setLoadingState(false);
            }
        }

        async function processStream(reader, msgId) {
            const decoder = new TextDecoder('utf-8');
            let buffer = '', fullContent = '', fullReasoning = '';

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (!trimmedLine || trimmedLine === 'data: [DONE]') continue;
                        if (trimmedLine.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(trimmedLine.slice(6));
                                const delta = data.choices[0].delta;
                                if (delta.reasoning_content) fullReasoning += delta.reasoning_content;
                                if (delta.content) fullContent += delta.content;
                                updateMessageDOM(msgId, fullReasoning, fullContent, true);
                            } catch (e) {}
                        }
                    }
                }
            } finally {
                updateMessageDOM(msgId, fullReasoning, fullContent, false);
                // 【保存完整上下文】将 AI 回复推入历史，并同步到本地存储
                messageHistory.push({ role: 'assistant', content: fullContent });
                saveHistoryToLocal();
                document.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
            }
        }

        function updateMessageDOM(msgId, reasoning, content, isStreaming) {
            const container = document.getElementById(msgId);
            if (!container) return;
            let html = '';
            
            if (reasoning) {
                html += `
                    <details class="mb-2 bg-gray-100 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden" ${isStreaming ? 'open' : ''}>
                        <summary class="px-3 py-2 text-xs font-medium text-gray-500 flex items-center gap-1">
                            <span>${isStreaming ? '正在深度思考...' : '思考过程完成'}</span>
                        </summary>
                        <div class="px-3 py-2 text-sm text-gray-600 dark:text-gray-300 border-t border-gray-200 dark:border-gray-700 whitespace-pre-wrap">${escapeHTML(reasoning)}</div>
                    </details>
                `;
            }

            if (content || !isStreaming) {
                const displayContent = content || (isStreaming ? '<span class="animate-pulse text-gray-400">正在打字...</span>' : '');
                html += `<div class="markdown-body text-sm">${marked.parse(displayContent)}</div>`;
            }

            const contentDiv = container.querySelector('.msg-content');
            contentDiv.innerHTML = html;
            container.setAttribute('data-raw', content);
            scrollToBottom();
        }

        function appendMessageDOM(role, text, id = '') {
            const isUser = role === 'user';
            const html = `
                <div class="flex flex-col gap-1 ${isUser ? 'items-end' : 'items-start'}" ${id ? `id="${id}"` : ''}>
                    <div class="px-4 py-2.5 rounded-2xl max-w-[92%] shadow-sm ${isUser ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-white dark:bg-darksurface border border-gray-100 dark:border-gray-800 rounded-bl-sm'}">
                        <div class="msg-content whitespace-pre-wrap ${isUser ? 'text-sm' : ''}">${isUser ? escapeHTML(text) : ''}</div>
                    </div>
                    ${!isUser ? `
                        <div class="pl-1 mt-1">
                            <button onclick="copyMessage(this)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 text-xs active:bg-gray-200 dark:active:bg-gray-700">
                                <svg class="w-3.5 h-3.5 icon-copy" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                <svg class="w-3.5 h-3.5 icon-check hidden text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                <span class="copy-text">复制</span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
            DOM.chatContainer.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        async function copyMessage(btn) {
            const container = btn.closest('[id]');
            const textToCopy = container.getAttribute('data-raw');
            if (!textToCopy) return;
            try {
                await navigator.clipboard.writeText(textToCopy);
                const iconCopy = btn.querySelector('.icon-copy');
                const iconCheck = btn.querySelector('.icon-check');
                const textSpan = btn.querySelector('.copy-text');
                iconCopy.classList.add('hidden'); iconCheck.classList.remove('hidden');
                textSpan.innerText = '已复制'; textSpan.classList.add('text-green-500');
                setTimeout(() => {
                    iconCopy.classList.remove('hidden'); iconCheck.classList.add('hidden');
                    textSpan.innerText = '复制'; textSpan.classList.remove('text-green-500');
                }, 2000);
            } catch (err) { alert("复制失败~"); }
        }

        function saveHistoryToLocal() {
            localStorage.setItem('ds_history', JSON.stringify(messageHistory));
        }

        function setLoadingState(loading) {
            isGenerating = loading;
            DOM.sendBtn.disabled = loading;
            DOM.sendBtn.innerHTML = loading 
                ? `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`
                : `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>`;
        }

        function scrollToBottom() { DOM.chatContainer.scrollTop = DOM.chatContainer.scrollHeight; }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag])); }
    </script>
</body>
</html>
